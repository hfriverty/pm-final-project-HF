<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype: Plain explainer for why income is asked (B2)</title>
<style>
/* ==========================================================================
   BRAND TOKENS: UNVERIFIED PLACEHOLDERS
   The Riverty brand bundle (vendor/riverty-brand) was not available in this
   session, so none of the values below are confirmed Riverty brand values.
   TBD: replace this block with the Riverty product-UI tokens
   (colors, typeface, radii, spacing). Nothing below this block hard-codes a color.
   ========================================================================== */
:root {
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --color-page: #eef0f3;
  --color-surface: #ffffff;
  --color-text: #15202b;
  --color-text-muted: #4f5d6b;
  --color-border: #cdd5dd;
  --color-primary: #0d5b4b;
  --color-on-primary: #ffffff;
  --color-primary-tint: #e6f1ee;
  --color-error: #a8201a;
  --color-error-tint: #fbeceb;
  --color-note-bg: #fff1c2;
  --color-note-text: #5c4400;
  --color-pass-bg: #d8f0e2;  --color-pass-text: #0b4a2c;
  --color-fail-bg: #fbd9d6;  --color-fail-text: #7a1410;
  --radius-s: 8px;
  --radius-m: 12px;
  --radius-l: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-page: #101418; --color-surface: #1a2027; --color-text: #e8edf2;
    --color-text-muted: #a5b1bd; --color-border: #36414c; --color-primary: #55c4a8;
    --color-on-primary: #0b1f19; --color-primary-tint: #1f2e2a; --color-error: #ff9a92;
    --color-error-tint: #3b2220; --color-note-bg: #3a3118; --color-note-text: #f2d98a;
    --color-pass-bg: #173826; --color-pass-text: #9fe3bd;
    --color-fail-bg: #4a1f1c; --color-fail-text: #ffb4ad;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-page: #101418; --color-surface: #1a2027; --color-text: #e8edf2;
  --color-text-muted: #a5b1bd; --color-border: #36414c; --color-primary: #55c4a8;
  --color-on-primary: #0b1f19; --color-primary-tint: #1f2e2a; --color-error: #ff9a92;
  --color-error-tint: #3b2220; --color-note-bg: #3a3118; --color-note-text: #f2d98a;
  --color-pass-bg: #173826; --color-pass-text: #9fe3bd;
  --color-fail-bg: #4a1f1c; --color-fail-text: #ffb4ad;
  color-scheme: dark;
}

/* ---------- base ---------- */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--color-page); color: var(--color-text);
  font: 16px/1.5 var(--font-ui);
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; }

/* ---------- prototype chrome (not part of the portal) ---------- */
.bar {
  max-width: 440px; margin: 0 auto; padding: 6px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 13px; color: var(--color-text-muted);
}
.bar .btns { display: flex; gap: 6px; }
.ghost {
  font-size: 13px; padding: 4px 10px; min-height: 28px; border-radius: 999px;
  border: 1px solid var(--color-border); background: var(--color-surface);
  color: var(--color-text); cursor: pointer;
}
.ghost:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }

/* ---------- portal frame ---------- */
.shell { max-width: 440px; margin: 0 auto; background: var(--color-surface); }
@media (min-width: 480px) {
  .shell {
    border: 1px solid var(--color-border); border-radius: var(--radius-l);
    overflow: hidden; margin-bottom: 16px;
  }
}
.ph {
  display: flex; align-items: center; gap: 10px; padding: 12px 20px;
  border-bottom: 1px solid var(--color-border); font-weight: 700;
}
.mark { width: 22px; height: 22px; border-radius: 7px; background: var(--color-primary); }
#portal { padding: 12px 20px 24px; outline: none; }

/* ---------- step indicator (numbers come from CSS, not copy) ---------- */
.steps { display: flex; gap: 8px; list-style: none; margin: 0 0 12px; padding: 0; counter-reset: step; }
.steps li {
  flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0;
  border-top: 4px solid var(--color-border); padding-top: 6px;
  color: var(--color-text-muted); counter-increment: step;
}
.steps li::before {
  content: counter(step); flex: none; width: 24px; height: 24px; border-radius: 50%;
  display: inline-grid; place-items: center; font-size: 14px; font-weight: 700; line-height: 1;
  background: var(--color-border); color: var(--color-text);
}
.steps li.done { border-color: var(--color-primary); }
.steps li.done::before { content: "\2713"; background: var(--color-primary); color: var(--color-on-primary); }
.steps li[aria-current="step"] { border-color: var(--color-primary); color: var(--color-text); font-weight: 700; }
.steps li[aria-current="step"]::before { background: var(--color-primary); color: var(--color-on-primary); }

/* ---------- back link ---------- */
.back {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin: -4px 0 0; padding: 4px 8px 4px 0;
  background: none; border: 0; color: var(--color-primary); font-weight: 700; cursor: pointer;
}
.back::before { content: "\2039"; font-size: 28px; line-height: 1; margin-top: -3px; }
.back:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; border-radius: 6px; }

/* ---------- type ---------- */
h1 { font-size: 26px; line-height: 1.2; margin: 6px 0 14px; letter-spacing: -0.01em; }
.q { display: block; font-size: 22px; line-height: 1.25; font-weight: 700; margin: 4px 0 8px; letter-spacing: -0.01em; }
.rule { margin: 0 0 10px; }

/* ---------- explanation block ---------- */
.explain {
  background: var(--color-primary-tint); border-left: 4px solid var(--color-primary);
  border-radius: 0 var(--radius-m) var(--radius-m) 0; padding: 12px 14px; margin: 0 0 16px;
}
.explain p { margin: 0 0 6px; }
.explain p:last-child { margin-bottom: 0; }

/* ---------- input ---------- */
.field {
  display: flex; align-items: center; background: var(--color-surface);
  border: 2px solid var(--color-text-muted); border-radius: var(--radius-m);
}
.field:focus-within { border-color: var(--color-primary); outline: 3px solid var(--color-primary); outline-offset: 2px; }
.field.invalid { border-color: var(--color-error); background: var(--color-error-tint); }
.eur { padding: 0 4px 0 16px; font-size: 22px; font-weight: 700; color: var(--color-text-muted); }
.field input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: inherit;
  font: inherit; font-size: 22px; font-weight: 600; height: 56px; padding: 0 16px 0 4px; outline: none;
  font-variant-numeric: tabular-nums;
}
.msg { min-height: 1.5em; margin: 8px 0 12px; color: var(--color-error); font-weight: 600; }
.msg > span[data-fixed]::before {
  content: "!"; display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 8px;
  border-radius: 50%; background: var(--color-error); color: var(--color-surface);
  font-size: 14px; font-weight: 800; vertical-align: 1px;
}
.msg .tbd { display: block; margin-top: 6px; font-weight: 400; }

/* ---------- buttons ---------- */
.primary {
  display: block; width: 100%; min-height: 54px; border: 0; border-radius: var(--radius-m);
  background: var(--color-primary); color: var(--color-on-primary);
  font-size: 18px; font-weight: 700; cursor: pointer;
}
.primary:active:not(:disabled) { transform: translateY(1px); }
.primary:disabled { background: var(--color-border); color: var(--color-text-muted); cursor: not-allowed; }
.primary:focus-visible { outline: 3px solid var(--color-text); outline-offset: 2px; }

/* ---------- screen 1: claims ---------- */
.claims { list-style: none; margin: 0 0 16px; padding: 0; border-top: 1px solid var(--color-border); }
.claims li {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 0; border-bottom: 1px solid var(--color-border);
}
.claims .name { font-weight: 700; display: block; }
.claims .ref { color: var(--color-text-muted); display: block; }
.claims .amt { font-weight: 700; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.next { margin: 0 0 16px; }

/* ---------- screen 3: confirmation ---------- */
.echo {
  position: relative; font-size: 22px; line-height: 1.3; font-weight: 700; margin: 0 0 16px;
  background: var(--color-primary-tint); border-radius: var(--radius-m); padding: 16px 16px 16px 56px;
}
.echo::before {
  content: "\2713"; position: absolute; left: 16px; top: 16px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; background: var(--color-primary); color: var(--color-on-primary);
  font-size: 16px; font-weight: 800; line-height: 1;
}

/* ---------- [TBD] markers (test mode only) ---------- */
.tbd {
  background: var(--color-note-bg); color: var(--color-note-text); border: 1px dashed var(--color-note-text);
  border-radius: var(--radius-s); padding: 6px 10px; margin: 0 0 8px;
}
.explain .tbd { margin: 0 0 6px; }

/* ---------- test panel ---------- */
.panel { max-width: 760px; margin: 0 auto 24px; padding: 0 12px; font-size: 14px; }
.panel h2 { font-size: 16px; margin: 16px 0 6px; }
.panel .scroll { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius-m); }
.panel table { border-collapse: collapse; width: 100%; background: var(--color-surface); }
.panel th, .panel td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
.panel tr:last-child td { border-bottom: 0; }
.panel th { color: var(--color-text-muted); font-weight: 600; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-weight: 700; font-size: 12px; white-space: nowrap; }
.chip.ok { background: var(--color-pass-bg); color: var(--color-pass-text); }
.chip.bad { background: var(--color-fail-bg); color: var(--color-fail-text); }
.chip.open { background: var(--color-note-bg); color: var(--color-note-text); }
.panel p { margin: 4px 0; color: var(--color-text-muted); }
</style>
</head>
<body>

<div class="bar">
  <span id="barLabel">Prototype · fictional data</span>
  <span class="btns">
    <button type="button" class="ghost" id="modeBtn"></button>
    <button type="button" class="ghost" id="restartBtn">Restart</button>
  </span>
</div>

<div class="shell">
  <header class="ph" data-fixed><span class="mark" aria-hidden="true"></span><span>Instalment portal</span></header>
  <main id="portal" tabindex="-1"></main>
</div>

<section class="panel" id="panel" hidden></section>

<script>
(function () {
  'use strict';

  /* ---------- Config ---------- */
  var PERIOD = 'typical month';
  var BASIS = 'after tax';
  var CONFIG = {
    correctionConfirmed: false, // PRD: "Change" link only once correction before the agreement is confirmed
    ceiling: 99999              // PRD prototype ceiling; real value TBD from engineering
  };

  /* ---------- Approved statements: one list, one ID per line (FR8) ----------
     text = null means no approved wording exists yet.
     Rendered only if text exists AND approved is true.
     In release mode anything else is omitted; in #test mode it shows as [TBD].
     ST-01 and ST-03 are PRD draft copy, marked approved here for prototype use only. */
  var ST = {
    'ST-01': { text: 'Your income in a ' + PERIOD + ', ' + BASIS, approved: true,
               tbd: '[TBD: label, period and basis pending collections policy]' },
    'ST-02': { text: null, approved: false,
               tbd: '[TBD: rule for changing income, pending collections policy]' },
    'ST-03': { text: 'We ask so we can suggest instalments that fit you.', approved: true,
               tbd: '[TBD: why we ask, pending compliance]' },
    'ST-04': { text: null, approved: false,
               tbd: '[TBD: what your income is used for, from compliance]' },
    'ST-05': { text: null, approved: false,
               tbd: '[TBD: who sees your income, from compliance]' },
    'ST-06': { text: 'Next: a few questions about your income', approved: true,
               tbd: '[TBD]' },
    'ST-07': { text: null, approved: false,
               tbd: '[TBD: add “one answer covers both claims” only if income is asked once, to confirm]' },
    'ST-08': { text: null, approved: false,
               tbd: '[TBD: “Change” link and “you can change it” line, only once correction before the agreement is confirmed]' }
  };

  var MSG = {
    zero:   'Enter an amount above 0 €.',
    chars:  'Use digits only, for example 1.200,50.',
    format: 'Use a comma for cents, for example 1.200,50.',
    high:   'That income looks too high. Please check it.'
  };
  var TBD_NO_INCOME = '[TBD: route for consumers with no income, owned by collections policy]';
  var TBD_CEILING = '[TBD: real ceiling from engineering]';

  var CLAIMS = [
    { name: 'Online fashion order', ref: 'Ref. 0412-A', amount: '€209.08' },
    { name: 'Electronics order',    ref: 'Ref. 0587-C', amount: '€368.45' }
  ];

  /* ---------- State (in memory only: no storage of any kind) ---------- */
  var state = { screen: 1, raw: '', touched: false, amount: null, submitted: false, t0: 0, times: [] };
  var mode = 'release';

  var portal = document.getElementById('portal');
  var panel = document.getElementById('panel');
  var modeBtn = document.getElementById('modeBtn');
  var restartBtn = document.getElementById('restartBtn');

  function readMode() { mode = (window.location.hash === '#test') ? 'test' : 'release'; }

  /* ---------- Parsing German number formats (FR7) ---------- */
  function parseAmount(raw) {
    var s = String(raw).trim();
    if (s === '') return { ok: false, code: 'empty' };
    if (/[^0-9.,]/.test(s)) return { ok: false, code: 'chars' };
    var thousands = /^\d{1,3}(\.\d{3})+(,\d{1,2})?$/;  // 1.200 / 1.200,50
    var plain = /^\d+(,\d{1,2})?$/;                    // 1200 / 1200,50
    if (thousands.test(s) || plain.test(s)) {
      var n = Number(s.replace(/\./g, '').replace(',', '.'));
      if (!(n > 0)) return { ok: false, code: 'zero' };
      if (n > CONFIG.ceiling) return { ok: false, code: 'high' };
      return { ok: true, value: n };
    }
    return { ok: false, code: 'format' };              // 12.00 / 1,200.50: never guessed
  }
  function msgKey(code) { return code === 'empty' ? 'zero' : code; }

  function formatEur(v) {
    return new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v);
  }

  /* ---------- Statement rendering ---------- */
  function stmt(id, tag, cls, attrs) {
    var s = ST[id];
    attrs = attrs || '';
    if (s.text && s.approved) {
      return '<' + tag + (cls ? ' class="' + cls + '"' : '') + ' data-sid="' + id + '"' + attrs + '>' + s.text + '</' + tag + '>';
    }
    if (mode === 'test') {
      return '<' + tag + ' class="tbd" data-tbd="' + id + '"' + (tag === 'label' ? attrs : '') + '>' + s.tbd + '</' + tag + '>';
    }
    return ''; // release mode: omitted, nothing stands in
  }

  /* ---------- Screens ---------- */
  function stepsHTML(current) {
    var names = ['Claims', 'Income', 'Plan'];
    var out = '<ol class="steps" data-fixed aria-label="Steps">';
    for (var i = 0; i < names.length; i++) {
      var cls = i + 1 < current ? ' class="done"' : '';
      var cur = i + 1 === current ? ' aria-current="step"' : '';
      out += '<li' + cls + cur + '>' + names[i] + '</li>';
    }
    return out + '</ol>';
  }

  function screen1() {
    var items = CLAIMS.map(function (c) {
      return '<li><span><span class="name">' + c.name + '</span><span class="ref">' + c.ref + '</span></span>' +
             '<span class="amt">' + c.amount + '</span></li>';
    }).join('');
    var next = stmt('ST-06', 'p', 'next');
    var more = stmt('ST-07', 'p', '');
    return stepsHTML(1) +
      '<h1 data-fixed>Your claims</h1>' +
      '<ul class="claims" data-fixed>' + items + '</ul>' +
      next + more +
      '<button type="button" class="primary" id="go1" data-fixed>Continue</button>';
  }

  function screen2() {
    var facts = stmt('ST-03', 'p', '') + stmt('ST-04', 'p', '') + stmt('ST-05', 'p', '');
    var explain = facts ? '<div class="explain" id="explain">' + facts + '</div>' : '';
    return '<button type="button" class="back" id="back" data-fixed>Back</button>' +
      stepsHTML(2) +
      '<form id="form" novalidate autocomplete="off">' +
        stmt('ST-01', 'label', 'q', ' for="income"') +
        stmt('ST-02', 'p', 'rule') +
        explain +
        '<div class="field" id="field">' +
          '<span class="eur" aria-hidden="true" data-fixed>€</span>' +
          '<input id="income" name="income" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" ' +
                 'aria-describedby="' + (explain ? 'explain ' : '') + 'msg">' +
        '</div>' +
        '<p class="msg" id="msg" aria-live="polite"></p>' +
        '<button type="submit" class="primary" id="go2" data-fixed disabled>Continue</button>' +
      '</form>';
  }

  function screen3() {
    var change = CONFIG.correctionConfirmed
      ? '<p data-fixed>You can change your answer. <button type="button" class="back" id="change">Change</button></p>'
      : stmt('ST-08', 'p', '');
    return '<h1 data-fixed>We’ve noted your income</h1>' +
      '<p class="echo" id="echo" data-fixed></p>' +
      change +
      '<p class="next" data-fixed>Next you choose a plan that fits.</p>' +
      '<button type="button" class="primary" id="plans" data-fixed>See plan options</button>' +
      (mode === 'test' ? '<p class="tbd" style="margin-top:10px">[Stub: this button opens nothing]</p>' : '');
  }

  /* ---------- Render + events ---------- */
  function render(moveFocus) {
    var html = state.screen === 1 ? screen1() : state.screen === 2 ? screen2() : screen3();
    portal.innerHTML = html;
    if (state.screen === 1) {
      document.getElementById('go1').addEventListener('click', function () { go(2); });
    } else if (state.screen === 2) {
      bindScreen2();
    } else {
      document.getElementById('echo').textContent = '€' + formatEur(state.amount) + ', ' + PERIOD + ', ' + BASIS;
      var ch = document.getElementById('change');
      if (ch) ch.addEventListener('click', function () { go(2); });
      // "See plan options" is a stub on purpose: no handler.
    }
    renderBar();
    renderPanel();
    if (moveFocus) portal.focus({ preventScroll: false });
  }

  function go(n) {
    state.screen = n;
    if (n === 2) { state.submitted = false; }
    render(true);
    if (n === 2) { state.t0 = performance.now(); }
    window.scrollTo(0, 0);
  }

  function bindScreen2() {
    var form = document.getElementById('form');
    var inp = document.getElementById('income');
    var btn = document.getElementById('go2');
    var msg = document.getElementById('msg');
    var field = document.getElementById('field');

    inp.value = state.raw;

    function validate() {
      var r = parseAmount(inp.value);
      var show = state.touched || inp.value.trim() !== '';
      var html = '';
      if (!r.ok && show) {
        var key = msgKey(r.code);
        html = '<span data-fixed>' + MSG[key] + '</span>';
        if (mode === 'test') {
          if (key === 'zero') html += '<span class="tbd">' + TBD_NO_INCOME + '</span>';
          if (key === 'high') html += '<span class="tbd">' + TBD_CEILING + '</span>';
        }
      }
      msg.innerHTML = html;
      var invalid = !r.ok && show;
      field.classList.toggle('invalid', invalid);
      inp.setAttribute('aria-invalid', invalid ? 'true' : 'false');
      btn.disabled = !r.ok || state.submitted;
      return r;
    }

    inp.addEventListener('input', function () {
      state.raw = inp.value;
      state.touched = true;
      validate();
      renderPanel();
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (state.submitted) return;           // double tap: one submission only
      var r = parseAmount(inp.value);
      if (!r.ok) { validate(); return; }
      state.submitted = true;
      btn.disabled = true;
      state.amount = r.value;
      state.times.push((performance.now() - state.t0) / 1000);
      go(3);
    });

    document.getElementById('back').addEventListener('click', function () { go(1); });
    validate();
  }

  /* ---------- Prototype bar ---------- */
  function renderBar() {
    modeBtn.textContent = mode === 'test' ? 'Test mode: switch to release' : 'Release mode: switch to test';
  }
  modeBtn.addEventListener('click', function () {
    window.location.hash = (mode === 'test') ? '#release' : '#test';
  });
  restartBtn.addEventListener('click', function () {
    state.raw = ''; state.touched = false; state.amount = null; state.submitted = false;
    go(1);
  });
  window.addEventListener('hashchange', function () { readMode(); render(false); });
  window.addEventListener('resize', function () { renderPanel(); });

  /* ---------- Test panel: checks against the PRD ---------- */
  var PERIOD_RE = /\b(day|days|daily|week|weeks|weekly|month|months|monthly|year|years|yearly|annual|annually|quarter|fortnight)\b/gi;

  function words(s) { return s.trim().split(/\s+/).filter(Boolean).length; }
  function chip(kind) {
    var label = kind === 'ok' ? 'PASS' : kind === 'bad' ? 'FAIL' : 'OPEN';
    return '<span class="chip ' + kind + '">' + label + '</span>';
  }

  function unmappedTextNodes() {
    var count = 0;
    var walker = document.createTreeWalker(portal, NodeFilter.SHOW_TEXT, null);
    var node;
    while ((node = walker.nextNode())) {
      if (!node.nodeValue.trim()) continue;
      var p = node.parentElement;
      if (p.closest('.tbd')) continue;
      if (!p.closest('[data-sid],[data-fixed]')) count++;
    }
    return count;
  }

  function renderPanel() {
    panel.hidden = (mode !== 'test');
    if (mode !== 'test') return;

    var rows = [];

    // Snapshot of visible portal text, TBD markers excluded
    var clone = portal.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('.tbd'), function (n) { n.remove(); });
    var txt = clone.textContent;
    var periods = txt.match(PERIOD_RE) || [];
    var basis = (txt.match(/after tax/gi) || []).length;
    var okPeriod = state.screen === 1 ? periods.length === 0 : (periods.length === 1 && basis === 1);
    rows.push(['FR1', 'Screen ' + state.screen + ': ' + periods.length + ' period word(s)' +
      (periods.length ? ' (' + periods.join(', ') + ')' : '') + ', ' + basis + ' basis term(s). Expected ' +
      (state.screen === 1 ? '0 and 0' : '1 and 1'), okPeriod ? 'ok' : 'bad']);

    // FR2
    var rule = ST['ST-02'];
    if (rule.text && rule.approved) {
      rows.push(['FR2', 'Rule sentence: ' + words(rule.text) + ' words (max 12)', words(rule.text) <= 12 ? 'ok' : 'bad']);
    } else {
      rows.push(['FR2', 'Rule sentence not drafted: waiting on collections policy', 'open']);
    }

    // FR3
    var clash = txt.match(/\b(salary|wages?|earnings|pay|net|gross)\b/gi) || [];
    rows.push(['FR3', 'Contradicting income terms on this screen: ' + clash.length, clash.length === 0 ? 'ok' : 'bad']);

    // FR4
    var facts = ['ST-03', 'ST-04', 'ST-05'];
    var approvedFacts = facts.filter(function (id) { return ST[id].text && ST[id].approved; });
    rows.push(['FR4', 'Approved explanation facts: ' + approvedFacts.length + ' of 3 (' + (3 - approvedFacts.length) + ' waiting on compliance)',
      approvedFacts.length === 3 ? 'ok' : 'open']);
    approvedFacts.forEach(function (id) {
      var w = words(ST[id].text);
      rows.push(['FR4', id + ': ' + w + ' words (max 9)' + (w > 9 ? '. The PRD draft counts 8 but has ' + w : ''), w <= 9 ? 'ok' : 'bad']);
    });

    // FR5
    var total = words(ST['ST-01'].text || '') + (rule.text && rule.approved ? words(rule.text) : 0) +
      approvedFacts.reduce(function (a, id) { return a + words(ST[id].text); }, 0);
    rows.push(['FR5', 'Label + rule + explanation: ' + total + ' words (max 50)', total <= 50 ? 'ok' : 'bad']);

    // FR6
    if (state.screen === 2) {
      var inp = document.getElementById('income');
      var lbl = portal.querySelector('.q');
      var vh = window.innerHeight, vw = window.innerWidth;
      var fit = inp && lbl && lbl.getBoundingClientRect().top >= 0 && inp.getBoundingClientRect().bottom <= vh;
      rows.push(['FR6', 'Label, explanation and field in one viewport (' + vw + ' × ' + vh + '): ' + (fit ? 'yes' : 'no. Resize to 390 × 844 to check') +
        '. Modals, tooltips, links: 0', fit ? 'ok' : 'open']);
    } else {
      rows.push(['FR6', 'Open Screen 2 to check the viewport fit', 'open']);
    }

    // FR8 + E3 text mapping
    var unapproved = Array.prototype.filter.call(portal.querySelectorAll('[data-sid]'), function (n) {
      return !ST[n.getAttribute('data-sid')].approved;
    }).length;
    rows.push(['FR8', 'Unapproved sentences rendered as normal text: ' + unapproved, unapproved === 0 ? 'ok' : 'bad']);
    var unmapped = unmappedTextNodes();
    rows.push(['E3', 'Text nodes on this screen without an approved ID or fixed label: ' + unmapped, unmapped === 0 ? 'ok' : 'bad']);

    // E2
    if (state.times.length) {
      var sorted = state.times.slice().sort(function (a, b) { return a - b; });
      var mid = Math.floor(sorted.length / 2);
      var med = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      rows.push(['E2', 'Screen 2 load to valid submit: last ' + state.times[state.times.length - 1].toFixed(1) +
        ' s, median ' + med.toFixed(1) + ' s over ' + state.times.length + ' run(s) (max 60 s)', med <= 60 ? 'ok' : 'bad']);
    } else {
      rows.push(['E2', 'No timed submit yet. Go through Screen 2 once', 'open']);
    }

    var html = '<h2>Checks on this screen</h2><div class="scroll"><table><thead><tr><th>Rule</th><th>Result</th><th>Status</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + chip(r[2]) + '</td></tr>';
    });
    html += '</tbody></table></div>';

    // Scripted inputs (FR7 / E3)
    var scripted = [
      { i: '1200',     ok: true, v: 1200 },
      { i: '1.200',    ok: true, v: 1200 },
      { i: '1.200,50', ok: true, v: 1200.5 },
      { i: '1200,50',  ok: true, v: 1200.5 },
      { i: '12.00',    key: 'format' },
      { i: '1,200.50', key: 'format' },
      { i: 'abc',      key: 'chars' },
      { i: '0',        key: 'zero' },
      { i: '',         key: 'zero' },
      { i: '99999999', key: 'high' }
    ];
    var passed = 0;
    var body = scripted.map(function (t) {
      var r = parseAmount(t.i);
      var good, got;
      if (t.ok) { good = r.ok && r.value === t.v; got = r.ok ? 'accepted as ' + r.value : 'rejected'; }
      else { good = !r.ok && msgKey(r.code) === t.key; got = r.ok ? 'accepted (wrong)' : MSG[msgKey(r.code)]; }
      if (good) passed++;
      return '<tr><td>' + (t.i === '' ? '(empty)' : t.i) + '</td><td>' + (t.ok ? 'accepted as ' + t.v : 'rejected: ' + MSG[t.key]) +
             '</td><td>' + got + '</td><td>' + chip(good ? 'ok' : 'bad') + '</td></tr>';
    }).join('');
    html += '<h2>Scripted inputs: ' + passed + ' of 10 handled correctly</h2><div class="scroll"><table><thead><tr><th>Input</th><th>Expected</th><th>Got</th><th>Status</th></tr></thead><tbody>' +
            body + '</tbody></table></div>' +
            '<p>Test mode shows [TBD] placeholders for lines without approved wording. Release mode omits them. The panel is not part of the portal.</p>';
    panel.innerHTML = html;
  }

  /* ---------- Start ---------- */
  readMode();
  render(false);
})();
</script>
</body>
</html>
